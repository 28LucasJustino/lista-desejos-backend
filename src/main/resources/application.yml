server:
  port: 8080

spring:
  application:
    name: wishlist-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/wishlist_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

application:
  security:
    jwt:
      secret-key: wishlist-super-secret-jwt-key-for-dope-security-terminal-2026-auth-tokens-replace-in-prod
      expiration: 86400000 # 24 hours

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
